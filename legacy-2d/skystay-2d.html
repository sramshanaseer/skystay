<style>

.rv{display:flex;gap:8px;align-items:center;margin:6px 0}.rv .bb{flex:1;background:#fffdd2;color:#1d2433;border:3px solid #1d2433;border-radius:16px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;position:relative}.rv .bb:before{content:'';position:absolute;left:-12px;top:14px;border:7px solid transparent;border-right:7px solid #1d2433}.rv .th{white-space:nowrap;font-size:14px}.rv .th i{font-style:normal;opacity:.25}.rv .th i.a{opacity:1}.rv em{font-style:normal;color:#d22}#ravg{text-align:center;font-weight:700;margin-bottom:6px;text-shadow:0 1px 0 #1a3d7a}body.lux{background:#0f1a30}body.lux #top{background:#142342;border-bottom-color:#8a6a2c;color:#f3ead0}body.lux #top span{background:#0f1a30;border-color:#8a6a2c;color:#f3ead0}

body.lux #bar{background:#101b33;border-top-color:#e6c46a}body.lux button{background:linear-gradient(#37507d,#1f2f52);border-color:#8a6a2c}body.lux button.on,body.lux button.sel{background:linear-gradient(#f3d77e,#c9a24a);color:#2a1d05;border-color:#f3d77e}
body.lux .box{background:linear-gradient(#2a3f68,#101d3a);border-color:#e6c46a}body.lux .box h2{color:#f3d77e;text-shadow:0 2px 0 #3a2a05}body.lux .r{background:rgba(230,196,106,.12);border-color:#8a6a2c}
</style></head><body>
<div id="banner"><div id="bn"><span id="bnn"></span><span id="bst"></span><div id="bar2"><div id="bbar"></div></div></div></div>

<div id="bar"><div class="row"><button id="tSel" class="on">➤<small>Select</small></button><button id="tBuild">🔨<small>Build</small></button><button id="tStaff">👥<small>Staff</small></button><button id="tGoals">🎯<small>Goals</small></button><button id="tStyle">🎩<small>Style</small></button><button id="tRev">💬<small>Reviews</small></button><button id="tFin">📈<small>Finance</small></button><button id="tBull">❌<small>Demolish</small></button><button id="bRate"></button><button id="bExp"></button><button id="bSave">💾<small>Save</small></button></div>

<div id="build" class="ov"><div class="box"><h2>Build<button class="x" data-x>✕</button></h2><div class="two"><div class="l" id="bcats"></div><div class="r"><div id="bslots" style="display:flex;flex-direction:column;gap:6px"></div><div class="card" id="binfo"></div></div></div></div></div>

<div id="goals" class="ov"><div class="box"><h2>Goals<button class="x" data-x>✕</button></h2><div class="card" id="gl"></div><div style="display:flex;gap:8px;margin-top:10px"><button id="ng" style="flex:1">New game</button><button data-x style="flex:1">Close</button></div></div></div>
<div id="fin" class="ov"><div class="box"><h2>Finance<button class="x" data-x>✕</button></h2><div class="card"><canvas id="fc" width="320" height="150" style="width:100%"></canvas><div id="ft"></div></div></div></div>
<div id="rev" class="ov"><div class="box"><h2>Guest Reviews<button class="x" data-x>✕</button></h2><div id="ravg"></div><div id="rl"></div></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const CW=52,CH=58,PX=130,RX=70,SKY=70,MAXF=7,MAXW=15,KEY='skystay-save-3';
const T={
room:{n:'Standard',e:'🛏️',c:500,u:20,l:1,col:'#8f9b5c',cat:'Rooms',st:0,d:'Standard single room. Earns $60 a night.'},
suite:{n:'Deluxe suite',e:'👑',c:1200,u:50,l:1,col:'#a77fc4',cat:'Rooms',st:1.5,d:'Luxury suite. Earns $150 a night and hosts VIPs.'},
reception:{n:'Reception',e:'🛎️',c:300,u:10,l:0,col:'#c5763c',cat:'Service',st:0,d:'Guests check in and out here. Needs a receptionist.'},
laundry:{n:'Laundry',e:'🧺',c:600,u:30,l:0,col:'#4f8acb',cat:'Service',st:0,d:'Helps maids clean faster and lifts mood.'},
shop:{n:'Gift shop',e:'🎁',c:700,u:25,l:0,col:'#c0547a',cat:'Service',st:1,d:'Guests buy souvenirs. Small steady income.'},
restaurant:{n:'Cafe',e:'☕',c:800,u:40,l:0,col:'#d99a3b',cat:'Food',st:0,d:'Small cafe with tasty food. Requires a waiter.'},
penthouse:{n:'Penthouse',e:'🏙️',c:3000,u:120,l:1,col:'#2e3558',cat:'Rooms',st:2.5,d:'The finest room in the hotel. Earns $400 a night and is the first choice of VIPs. Floor 3 or higher.'},
pool:{n:'Rooftop pool',e:'🏊',c:2500,u:90,l:1,col:'#4fb6e6',cat:'Health',st:1.5,d:'A sparkling pool. Guests pay for it and it lifts mood. Upper floors only.'},
minibar:{n:'Minibar',e:'🍾',c:150,u:6,l:1,col:'#888',cat:'Upgrades',st:.5,upg:1,d:'Add to a room: +$25 per night.'},
balcony:{n:'Balcony',e:'🌇',c:400,u:10,l:1,col:'#888',cat:'Upgrades',st:1,upg:1,d:'Add to a room: +$45 per night.'},
jacuzzi:{n:'Jacuzzi',e:'🛁',c:900,u:25,l:1,col:'#888',cat:'Upgrades',st:2,upg:1,only:1,d:'Add to a suite or penthouse: +$90 per night.'},
gym:{n:'Gym',e:'🏋️',c:900,u:40,l:2,col:'#5a6f8a',cat:'Health',st:0,d:'Guests work out. Lifts mood and income. Any floor.'},
spa:{n:'Spa',e:'💆',c:1500,u:80,l:2,col:'#4aa39a',cat:'Health',st:2,d:'Relaxing treatments. Big income and mood boost. Any floor.'},
elev:{n:'Elevator',e:'🛗',c:400,u:15,l:2,col:'#4a5b6c',cat:'Elevators',st:0,d:'Carries guests and staff between floors. Start in the lobby and stack cells upward to extend the shaft. Build more shafts to cut waiting.'},
lounge:{n:'Lounge',e:'🛋️',c:400,u:20,l:0,col:'#7c9b50',cat:'Entertainment',st:0,d:'A cosy place to unwind. Lifts mood.'},
hall:{n:'Lobby',e:'🛋️',c:0,u:0,l:0,col:'#b4472f'}};
const CATS=['Rooms','Service','Food','Elevators','Health','Entertainment','Upgrades'],PRICE={room:60,suite:150,penthouse:400},UPB={minibar:25,balcony:45,jacuzzi:90};
const upBonus=x=>Object.keys(x.up||{}).reduce((a,k)=>a+(UPB[k]||0),0),upkeep=x=>(T[x.t].u||0)+Object.keys(x.up||{}).reduce((a,k)=>a+(T[k].u||0),0);
const ST={rec:['Receptionist','Works at reception. Checks guests in and out.','💁',400],maid:['Maid','Cleans rooms after guests leave.','🧹',200],wait:['Waiter','Serves food in the cafe.','🍴',300],eng:['Engineer','Fixes broken facilities.','🔧',500]};
const NAMES=['Ana','Ben','Cleo','Dev','Eli','Fay','Gus','Hana','Ivo','Jade','Kai','Lena','Milo','Nia','Omar','Pia'];
const SKIN=['#f1c9a0','#d9a577','#a9743f','#7a4a2a','#f6d7b8'],HAIR=['#2b1b10','#6a3b1c','#c9a13a','#111','#8a8a8a'];
const SHIRT=['#d65a5a','#4e86c9','#58a868','#c9a13a','#8a62b8','#e0884a','#3fa6a6'];
const UNI={rec:'#26355a',maid:'#6fb1d9',wait:'#2b2b2b',eng:'#e8742a',door:'#6e1a2e'};
const SPD=70,VSPD=2.4,PAT=16000,RATES=[.7,.85,1,1.25,1.5],rnd=a=>a[Math.random()*a.length|0];
let S,acc=0,last=0,bc='Rooms',bsel=null,sr_='rec';
const say=t=>$('msg').textContent=t,isRoom=x=>x.t=='room'||x.t=='suite'||x.t=='penthouse';
const cxOf=c=>PX+c*CW+CW/2,cellY=f=>SKY+(MAXF-1-f)*CH,okF=(d,f)=>d.l==2||(d.l==0)==(f==0);
const skl=p=>1+.35*(p.lv-1),wage=p=>ST[p.role][3]+150*(p.lv-1),expCost=()=>3000*((S.W-9)/2+1);
const cell=(t,f,c)=>({t:t,f:f,c:c,occ:0,dirty:false,br:false,res:false,claim:false});
function init(){S={name:'Skystay',money:6000,day:1,hour:8,speed:1,W:9,F:MAXF,g:[],staff:{rec:0,maid:0,wait:0,eng:0},pp:[],gs:[],fx:[],hist:[],rate:1,ri:2,goals:{},earned:0,vipSeen:false,fast:false,tut:0,cars:{},veh:[],reviews:[],newRev:0,lux:(()=>{try{return localStorage.getItem('skystay-style')!='classic'}catch(e){return true}})(),lw:{wait:0,noroom:0,nodesk:0},arr:0,lost:0,carFy:0,sat:70,stars:.5,tool:null,won:false,nm:0};
 for(let f=0;f<MAXF;f++)S.g.push(Array(MAXW).fill(null));for(let c=0;c<3;c++)S.g[0][c]=cell('hall',0,c);S.g[0][3]=cell('elev',0,3);S.g[1][3]=cell('elev',1,3);
 say('Welcome! Follow the guide to open your first hotel.');load()}
function each(fn){for(let f=0;f<S.F;f++)for(let c=0;c<S.W;c++){const x=S.g[f][c];if(x)fn(x,f,c)}}
function working(t){let ok=false;each(x=>{if(x.t==t&&!x.br)ok=true});return ok}
function cnt(t){let n=0;each(x=>{if(x.t==t)n++});return n}
function rc(){let n=0;each(x=>{if(isRoom(x))n++});return n}
function topF(){let t=0;each((x,f)=>{if(f>t)t=f});return t}
function mk(o){return Object.assign({x:cxOf(3),fy:0,route:[],ph:Math.random()*6,dir:1,mv:false,st:'idle',t:0,sk:rnd(SKIN),hair:rnd(HAIR),lv:1,fem:Math.random()<.5,gl:Math.random()<.22,outfit:Math.random()*3|0,hat:Math.random()<.4?1+(Math.random()*3|0):0,hc:rnd(SHIRT),pc:rnd(['#2d3346','#4a3a2a','#3b4f6b','#5a2f3a','#33503e'])},o)}
function sync(){for(const k in S.staff){const a=S.pp.filter(p=>p.role==k);
 while(a.length<S.staff[k]){const p=mk({role:k,nm:NAMES[S.nm++%NAMES.length]});S.pp.push(p);a.push(p)}
 while(a.length>S.staff[k]){const p=a.pop();release(p);S.pp.splice(S.pp.indexOf(p),1)}}}
function release(p){if(p.cell){p.cell.claim=false;p.cell=null}if(p.g){p.g.srv=false;if(p.g.room)p.g.room.res=false;p.g=null}}
function shafts(){const a=[];for(let c=0;c<S.W;c++){const x=S.g[0][c];if(x&&x.t=='elev'){let h=1;while(h<MAXF&&S.g[h][c]&&S.g[h][c].t=='elev')h++;a.push({c:c,h:h})}}return a}
function reach(f){return f==0||shafts().some(s=>s.h>f)}
function routeTo(p,x,f){p.route=[];if(p.fy!=f){const hi=Math.ceil(Math.max(p.fy,f));let best=null,bd=1e9;for(const s of shafts()){if(s.h>hi){const sx=cxOf(s.c),d=Math.abs(p.x-sx)+Math.abs(sx-x);if(d<bd){bd=d;best=sx}}}
 if(best==null)return;if(Math.abs(p.x-best)>1)p.route.push({x:best,fy:p.fy});p.route.push({x:best,fy:f})}p.route.push({x:x,fy:f})}
function move(p,dt){p.mv=false;const q=p.route[0];if(!q)return;p.mv=true;
 if(q.fy!=p.fy){const d=q.fy-p.fy,s=VSPD*(S.fast?1.7:1)*dt/1000;if(Math.abs(d)<=s)p.fy=q.fy;else p.fy+=Math.sign(d)*s;S.cars[Math.round((p.x-PX)/CW-.5)]=p.fy;if(p.fy==q.fy&&p.x==q.x)p.route.shift()}
 else{const d=q.x-p.x,s=SPD*(p.role=='g'?1:1+.1*(p.lv-1))*dt/1000;if(Math.abs(d)<=s){p.x=q.x;p.route.shift()}else{p.x+=Math.sign(d)*s;p.dir=Math.sign(d)}}
 p.ph+=dt/90}
function spawn(){const v=S.stars>=1&&Math.random()<.12,g=mk({role:'g',x:-16,st:'q',sh:v?'#d4a72c':rnd(SHIRT),vip:v,bag:Math.random()<.6,pat:PAT,stay:1+Math.floor(Math.random()*3)});if(S.lux&&(v||Math.random()<.4)){const tx=!v&&Math.random()<.4;S.veh.push({x:-70,st:'in',g:g,vip:v,taxi:tx,col:v?'#15161c':tx?'#e8c230':rnd(['#d94b4b','#3b6fb8','#e8e8ec','#2f8f6a','#7a4ab8'])})}else S.gs.push(g)}
function leave(g){g.st='leave';g.srv=false;g.bub='😡';routeTo(g,-16,0)}
function desks(){const a=[];for(let c=0;c<S.W;c++){const x=S.g[0][c];if(x&&x.t=='reception'&&!x.br)a.push(cxOf(c))}return a}
function desk(){for(let c=0;c<S.W;c++){const x=S.g[0][c];if(x&&x.t=='reception'&&!x.br)return cxOf(c)}return null}
function fx(x,y,t,c){S.fx.push({x:x,y:y,t:0,s:t,c:c})}
function update(dt){
 for(const e of S.fx){e.t+=dt;e.y-=dt*.03}S.fx=S.fx.filter(e=>e.t<1400);
 for(const c of S.veh){if(c.st=='in'){c.x+=95*dt/1000;if(c.x>=PX-56){c.x=PX-56;c.st='wait';c.t=900;if(c.g){c.g.x=c.x+4;S.gs.push(c.g);c.g=null}}}else if(c.st=='wait'){c.t-=dt;if(c.t<=0)c.st='out'}else c.x+=110*dt/1000}
 S.veh=S.veh.filter(c=>c.x<PX+S.W*CW+RX+90);
 const dk=desk(),q=S.gs.filter(g=>g.st=='q');q.forEach((g,i)=>g.qi=i);const recs=S.pp.filter(p=>p.role=='rec');
 for(const g of S.gs.slice()){move(g,dt);
  if(g.st=='q'){
   if(g.insp&&!g.route.length&&dk!=null&&g.qi==0){inspect(g);continue}
   const sp=dk==null?PX+50+g.qi*15:Math.max(PX+6,dk-30-g.qi*15);
   if(!g.srv){if(Math.abs(g.x-sp)>1)g.route=[{x:sp,fy:0}];g.pat-=dt;g.bub=g.pat<PAT*.25?'😡 Hurry!':g.pat<PAT*.6?(dk==null?'No reception!':'😠 Slow service'):'';if(!g.rv&&g.pat<PAT*.4){g.rv=1;const wn=q.filter(z=>!z.srv).length;addReview(S.staff.rec<1?'Nobody is working at the [[reception]]!':dk==null?'The [[reception]] is out of order!':wn>=6?'Very large queue at [[reception]]!!':'Large queue at the [[reception]]!',(wn>=6||S.staff.rec<1||dk==null)?-3:-2)}
 if(g.pat<=0){S.lost++;const why=(dk==null||S.staff.rec<1)?'nodesk':'wait';S.lw[why]++;if(why=='wait')addReview("It's so boring to stand in the waiting [[line]]!!",-3);leave(g);g.bub='😡 Too slow'}}
  }else if(g.st=='go'&&!g.route.length){const r=g.room;if(S.g[r.f][r.c]===r){r.occ=g.stay;r.res=false;if(g.celeb){S.sat=Math.min(100,S.sat+6);S.money+=500;fx(cxOf(r.c),cellY(r.f)+16,'+$500 buzz','#ffd24a')}}else S.lost++;S.gs.splice(S.gs.indexOf(g),1)}
  else if(g.st=='leave'&&!g.route.length)S.gs.splice(S.gs.indexOf(g),1);}
 for(const p of S.pp){move(p,dt);const still=!p.route.length,flat=Number.isInteger(p.fy);
  if(p.role=='rec'){const ds=desks(),ix=recs.indexOf(p),dx=ds.length?ds[ix%ds.length]-6+Math.floor(ix/ds.length)*12:PX+20+ix*14;

  else{const lk=S.stars<x.st;b.textContent=(lk?'🔒 ':'')+x.n;b.className=(lk?'lock ':'')+(bsel&&bsel.k==x.k?'sel':'');b.onclick=()=>{bsel=x;if(lk||x.k=='fast'){renderBuild();return}S.tool=x.k;say(x.upg?x.n+' ($'+x.c+', upkeep $'+x.u+'/month): tap a room to add it.':x.n+' ($'+x.c+', upkeep $'+x.u+'/month): tap an empty cell. '+['Ground floor only.','Upper floors only.','Any floor.'][x.l]);$('build').style.display='none'}}
  sl.appendChild(b)}
 const inf=$('binfo');
 if(!bsel){inf.innerHTML='<p><b>Choose an item to build</b></p>';return}
 const lk=S.stars<bsel.st;inf.innerHTML='<p><b>'+bsel.n+'</b></p><p>Build cost: <b class="c">$'+bsel.c+'</b><br>Keep expense: <b class="c">$'+bsel.u+'</b> per month</p><p>'+bsel.d+'</p>'+(lk?'<p><b>Unlocks at '+bsel.st+' stars.</b></p>':'');
 if(!lk){const g=document.createElement('button');g.textContent=bsel.k=='fast'?'Buy upgrade':'Build';g.onclick=()=>{
  if(bsel.k=='fast'){if(S.fast)return say('Express elevator already installed.');if(S.money<bsel.c)return say('Not enough money.');S.money-=bsel.c;S.fast=true;toast('Express elevator installed!')}
  else{S.tool=bsel.k;say(bsel.n+': tap an empty cell. '+['Ground floor only.','Upper floors only.','Any floor.'][bsel.l])}

function renderStaff(){const t=$('stabs');t.innerHTML='';
 for(const k in ST){const b=document.createElement('button');b.textContent=ST[k][0];b.className=k==sr_?'sel':'';b.onclick=()=>{sr_=k;renderStaff()};t.appendChild(b)}
 const r=ST[sr_],c=$('sbody');c.innerHTML='<div style="display:flex;gap:10px;align-items:center"><canvas id="pcv" width="84" height="120"></canvas><div><b>Salary: <span style="color:#b3211c">$'+r[3]+'</span></b><br><small>per month</small></div></div><p>'+r[1]+'</p>';
 const h=document.createElement('button');h.textContent='Hire';h.onclick=()=>{S.staff[sr_]++;sync();renderStaff()};c.appendChild(h);portrait($('pcv'),PORT[sr_],2.7);
 S.pp.filter(p=>p.role==sr_).forEach(p=>{const row=document.createElement('div');row.className='sr';const tc=300*p.lv;
  row.innerHTML='<div>'+p.nm+'<small>Level '+p.lv+' · $'+wage(p)+'/month</small></div>';{const pc=document.createElement('canvas');pc.width=38;pc.height=58;portrait(pc,p,1.4);row.prepend(pc)}
  const a=document.createElement('button');a.textContent=p.lv>=5?'Max':'Train $'+tc;a.onclick=()=>{if(p.lv>=5)return;if(S.money<tc)return say('Not enough money to train '+p.nm+'.');S.money-=tc;p.lv++;renderStaff()};
  const f=document.createElement('button');f.textContent='Fire';f.onclick=()=>{release(p);S.staff[p.role]--;S.pp.splice(S.pp.indexOf(p),1);renderStaff()};row.append(a,f);c.appendChild(row)})}
const GOALS=[['Build a reception desk',()=>cnt('reception')>0,150],['Build 5 rooms',()=>rc()>=5,300],['Hire 4 staff',()=>S.pp.length>=4,300],['Open a cafe',()=>cnt('restaurant')>0,300],['Reach 2 stars',()=>S.stars>=2,500],['Host a VIP guest in a suite',()=>S.vipSeen,600],['Build a spa',()=>cnt('spa')>0,800],['Earn $10,000 in total',()=>S.earned>=10000,1000],['Reach 4 stars',()=>S.stars>=4,2000],['Reach 5 stars',()=>S.stars>=4.95,5000],['Open a rooftop pool',()=>cnt('pool')>0,900],['Host a guest in a penthouse',()=>cnt('penthouse')>0,1200],['Install 5 room upgrades',()=>{let n=0;each(x=>{n+=Object.keys(x.up||{}).length});return n>=5},700]];
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3200)}
function goals(){GOALS.forEach((g,i)=>{if(!S.goals[i]&&g[1]()){S.goals[i]=1;S.money+=g[2];toast('Goal done: '+g[0]+' (+$'+g[2]+')')}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify({nme:S.name,m:S.money,d:S.day,h:S.hour,W:S.W,st:S.staff,pp:S.pp.map(p=>({r:p.role,n:p.nm,l:p.lv})),sat:S.sat,sr:S.stars,ri:S.ri,go:S.goals,hi:S.hist,ea:S.earned,vp:S.vipSeen,fa:S.fast,tu:S.tut,g:S.g.map(r=>r.map(x=>x&&{t:x.t,o:x.occ,d:x.dirty,b:x.br,v:x.vip,u:x.up}))}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(!j)return;Object.assign(S,{name:j.nme,money:j.m,day:j.d,hour:j.h,W:j.W,staff:j.st,sat:j.sat,stars:j.sr,ri:j.ri,rate:RATES[j.ri],goals:j.go,hist:j.hi,earned:j.ea,vipSeen:j.vp,fast:j.fa,tut:j.tu});if(j.pp)S.pp=j.pp.map(q=>mk({role:q.r,nm:q.n,lv:q.l}));j.g.forEach((r,f)=>r.forEach((x,c)=>{S.g[f][c]=x?Object.assign(cell(x.t,f,c),{occ:x.o,dirty:x.d,br:x.b,vip:x.v,up:x.u}):null}));sync();say('Welcome back! Your saved hotel was restored.')}catch(e){}}
$('tSel').onclick=()=>{S.tool=null;say('Select mode.')};$('tBull').onclick=()=>{S.tool='bull';say('Tap a room or facility to demolish it for a 50% refund.')};
$('tBuild').onclick=()=>{bsel=null;renderBuild();show('build')};$('tStaff').onclick=()=>{renderStaff();show('staff')};
$('tGoals').onclick=()=>{$('gl').innerHTML=GOALS.map((g,i)=>'<div class="sr"><span style="font-size:20px">'+(S.goals[i]?'✅':'⬜')+'</span><div>'+g[0]+'<small>Reward $'+g[2]+'</small></div></div>').join('');show('goals')};
$('tStyle').onclick=()=>{S.lux=!S.lux;try{localStorage.setItem('skystay-style',S.lux?'lux':'classic')}catch(e){}toast(S.lux?'Grand luxury style':'Classic style')};
$('tRev').onclick=()=>{renderReviews();show('rev')};
$('tFin').onclick=()=>{show('fin');const c=$('fc').getContext('2d'),H=S.hist,mx=Math.max(100,...H.map(h=>h.i));c.clearRect(0,0,320,150);c.font='10px sans-serif';const bw=320/14;H.forEach((h,i)=>{const hh=h.i/mx*115;c.fillStyle='#4aa86b';c.fillRect(i*bw+3,140-hh,bw-6,hh);if(h.e){c.fillStyle='#d65a5a';c.fillRect(i*bw+3,140-h.e/mx*115,bw-6,3)}});c.fillStyle='#555';c.fillText('Daily income, last 14 days (top = $'+mx+')',4,10);let up=0;each(x=>{up+=upkeep(x)});$('ft').textContent='Total earned: $'+Math.round(S.earned).toLocaleString()+' · Monthly wages: $'+S.pp.reduce((a,q)=>a+wage(q),0)+' · Upkeep: $'+up};
$('bRate').onclick=()=>{S.ri=(S.ri+1)%5;S.rate=RATES[S.ri];say('Room rates set to '+Math.round(S.rate*100)+'%. Higher rates earn more per guest but fewer guests arrive.')};
$('bExp').onclick=()=>{if(S.W>=MAXW)return;if(S.money<expCost())return say('Not enough money to expand.');S.money-=expCost();S.W+=2};
$('bSave').onclick=()=>{save();toast('Game saved')};$('bn').onclick=()=>{try{const n=prompt('Name your hotel',S.name);if(n)S.name=n.slice(0,14)}catch(e){}};
$('gs').onclick=()=>{S.tut=99};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.closest('.ov').style.display='none');
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x==b))});
